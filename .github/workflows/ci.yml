name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run release:check
      - run: npm test
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets
      - run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets

      # Reproducible != unvulnerable. These fail the build on a known advisory rather than
      # leaving it to a human to remember to look.
      - name: Audit npm dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: npm audit --audit-level=high
      - name: Install cargo-audit
        if: startsWith(matrix.platform, 'ubuntu')
        run: cargo install cargo-audit --locked || true
      - name: Audit Rust dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: cargo audit --file src-tauri/Cargo.lock
