name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/verify-studio

      # Reproducible != unvulnerable. These fail the build on a known advisory rather than
      # leaving it to a human to remember to look.
      - name: Audit npm dependencies
        if: runner.os == 'Linux'
        run: npm audit --audit-level=high
      - name: Install cargo-audit
        if: runner.os == 'Linux'
        run: cargo install cargo-audit --locked || true
      - name: Audit Rust dependencies
        if: runner.os == 'Linux'
        run: cargo audit --file src-tauri/Cargo.lock
