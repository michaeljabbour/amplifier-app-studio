name: Publish iOS TestFlight build

on:
  push:
    tags:
      - "studio-v*"
  workflow_dispatch:

concurrency:
  group: amplifier-studio-ios-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  testflight:
    runs-on: macos-15
    environment: release
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      APPLE_CERTIFICATE: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      IOS_TESTFLIGHT_GROUPS: ${{ vars.IOS_TESTFLIGHT_GROUPS || vars.IOS_TESTFLIGHT_GROUP }}
      IOS_BUNDLE_ID: com.amplifier.studio
    steps:
      - uses: actions/checkout@v7
      - name: Require App Store Xcode toolchain
        shell: bash
        run: |
          test -d "$DEVELOPER_DIR" || { echo "Required Xcode toolchain is unavailable: $DEVELOPER_DIR" >&2; exit 1; }
          XCODE_VERSION="$(xcodebuild -version | head -1)"
          IOS_SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "$XCODE_VERSION"
          echo "iOS SDK $IOS_SDK_VERSION"
          [[ "$XCODE_VERSION" == "Xcode 26."* ]] || { echo "Xcode 26 is required by App Store Connect" >&2; exit 1; }
          [[ "$IOS_SDK_VERSION" == "26."* ]] || { echo "iOS SDK 26 is required by App Store Connect" >&2; exit 1; }
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Require TestFlight credentials
        shell: bash
        run: |
          for name in APPLE_CERTIFICATE APPLE_TEAM_ID KEYCHAIN_PASSWORD APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_API_PRIVATE_KEY IOS_PROVISIONING_PROFILE_BASE64 IOS_TESTFLIGHT_GROUPS; do
            test -n "${!name}" || { echo "$name is required for TestFlight publishing" >&2; exit 1; }
          done
      - run: npm ci
      - run: npm run release:check
      - run: npm test
      - name: Import Apple signing identities and App Store profile
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/amplifier-studio-distribution.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/amplifier-studio-ios.keychain-db"
          PROFILE_PATH="$RUNNER_TEMP/amplifier-studio.mobileprovision"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"
          SIGNING_IDENTITIES="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH")"
          grep -F "Apple Development:" <<< "$SIGNING_IDENTITIES"
          grep -F "Apple Distribution:" <<< "$SIGNING_IDENTITIES"
          PROFILE_UUID="$(security cms -D -i "$PROFILE_PATH" | plutil -extract UUID raw -o - -)"
          PROFILE_NAME="$(security cms -D -i "$PROFILE_PATH" | plutil -extract Name raw -o - -)"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "IOS_PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "IOS_PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "IOS_PROFILE_PATH=$PROFILE_PATH" >> "$GITHUB_ENV"
      - name: Verify Xcode distribution signing settings
        run: |
          SIGNING_SETTINGS="$(xcodebuild \
            -project src-tauri/gen/apple/amplifier-studio.xcodeproj \
            -scheme amplifier-studio_iOS \
            -configuration release \
            -showBuildSettings)"
          grep -F "CODE_SIGN_IDENTITY = Apple Distribution" <<< "$SIGNING_SETTINGS"
          grep -F "CODE_SIGN_STYLE = Manual" <<< "$SIGNING_SETTINGS"
          grep -F "DEVELOPMENT_TEAM = $APPLE_TEAM_ID" <<< "$SIGNING_SETTINGS"
          grep -F "PROVISIONING_PROFILE_SPECIFIER = $IOS_PROFILE_NAME" <<< "$SIGNING_SETTINGS"
          IOS_PROFILE_PATH="$IOS_PROFILE_PATH" python3 - <<'PY'
          import hashlib
          import os
          import plistlib
          import subprocess

          profile = plistlib.loads(subprocess.check_output([
              "security", "cms", "-D", "-i", os.environ["IOS_PROFILE_PATH"]
          ]))
          fingerprints = [
              hashlib.sha1(certificate).hexdigest().upper()
              for certificate in profile.get("DeveloperCertificates", [])
          ]
          if not fingerprints:
              raise SystemExit("The App Store provisioning profile contains no signing certificates")
          print("App Store profile signing certificate SHA-1: " + ", ".join(fingerprints))
          PY
      - name: Install App Store Connect API key
        run: |
          API_KEY_DIRECTORY="$HOME/.appstoreconnect/private_keys"
          API_KEY_PATH="$API_KEY_DIRECTORY/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          mkdir -p "$API_KEY_DIRECTORY"
          printf '%s' "$APP_STORE_CONNECT_API_PRIVATE_KEY" > "$API_KEY_PATH"
          chmod 600 "$API_KEY_PATH"
          echo "APP_STORE_CONNECT_API_KEY_PATH=$API_KEY_PATH" >> "$GITHUB_ENV"
      - name: Build signed App Store archive
        run: npm run tauri -- ios build --export-method app-store-connect --archive-only --ci
      - name: Export signed App Store IPA
        run: |
          ARCHIVE_PATH="$(find src-tauri/gen/apple/build -maxdepth 1 -type d -name '*.xcarchive' -print -quit)"
          test -n "$ARCHIVE_PATH" || { echo "No signed iOS archive was produced" >&2; exit 1; }
          EXPORT_PATH="$RUNNER_TEMP/amplifier-studio-ios-export"
          EXPORT_OPTIONS_PATH="$RUNNER_TEMP/amplifier-studio-export-options.plist"
          IOS_PROFILE_NAME="$IOS_PROFILE_NAME" \
          IOS_BUNDLE_ID="$IOS_BUNDLE_ID" \
          APPLE_TEAM_ID="$APPLE_TEAM_ID" \
          EXPORT_OPTIONS_PATH="$EXPORT_OPTIONS_PATH" \
          python3 - <<'PY'
          import os
          import plistlib

          options = {
              "destination": "export",
              "generateAppStoreInformation": False,
              "manageAppVersionAndBuildNumber": True,
              "method": "app-store-connect",
              "provisioningProfiles": {
                  os.environ["IOS_BUNDLE_ID"]: os.environ["IOS_PROFILE_NAME"],
              },
              "signingCertificate": "Apple Distribution",
              "signingStyle": "manual",
              "stripSwiftSymbols": True,
              "teamID": os.environ["APPLE_TEAM_ID"],
              "testFlightInternalTestingOnly": False,
              "uploadSymbols": True,
          }
          with open(os.environ["EXPORT_OPTIONS_PATH"], "wb") as destination:
              plistlib.dump(options, destination)
          PY
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$EXPORT_OPTIONS_PATH"
          IPA_PATH="$(find "$EXPORT_PATH" -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          test -n "$IPA_PATH" || { echo "Xcode exported no IPA" >&2; exit 1; }
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"
      - name: Locate and verify IPA
        run: |
          test -n "$IPA_PATH" || { echo "No IPA was produced" >&2; exit 1; }
          IOS_BUILD_NUMBER="$(plutil -extract CFBundleVersion raw -o - src-tauri/gen/apple/amplifier-studio_iOS/Info.plist)"
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"
          echo "IOS_BUILD_NUMBER=$IOS_BUILD_NUMBER" >> "$GITHUB_ENV"
          xcrun altool --validate-app --file "$IPA_PATH" --type ios \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
      - uses: actions/upload-artifact@v6
        with:
          name: amplifier-studio-ios-ipa
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error
          retention-days: 30
      - name: Upload IPA to App Store Connect
        run: |
          xcrun altool --upload-app --file "$IPA_PATH" --type ios \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
      - name: Assign processed build to TestFlight group
        run: node scripts/app-store-connect-testflight.mjs "$APP_STORE_CONNECT_API_KEY_PATH"
