name: Publish desktop release

on:
  push:
    tags:
      - "studio-v*"

concurrency:
  group: amplifier-studio-desktop-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Node 22 bundles npm 10.9.x, whose arborist crashes resolving vitest 4's peer graph
      # ("Cannot read properties of null (reading 'edgesOut')" in #loadPeerSet). npm 11 resolves
      # it. Without this every runner fails at install, before a single test runs.
      - name: Use npm 11
        run: npm install -g npm@11
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run release:check
      - run: npm test
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  publish-desktop:
    needs: verify
    permissions:
      contents: write
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15
            args: --target aarch64-apple-darwin
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Node 22 bundles npm 10.9.x, whose arborist crashes resolving vitest 4's peer graph
      # ("Cannot read properties of null (reading 'edgesOut')" in #loadPeerSet). npm 11 resolves
      # it. Without this every runner fails at install, before a single test runs.
      - name: Use npm 11
        run: npm install -g npm@11
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cross-compilation target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run release:check
      - name: Require macOS signing and notarization credentials
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          for name in APPLE_CERTIFICATE KEYCHAIN_PASSWORD APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_API_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY; do
            test -n "${!name}" || { echo "$name is required for a signed and notarized macOS release" >&2; exit 1; }
          done
      - name: Import Developer ID certificate
        if: startsWith(matrix.platform, 'macos')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          STUDIO_CERTIFICATE_PATH="$RUNNER_TEMP/amplifier-studio-developer-id.p12"
          STUDIO_KEYCHAIN_PATH="$RUNNER_TEMP/amplifier-studio-signing.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$STUDIO_CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$STUDIO_KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$STUDIO_KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$STUDIO_KEYCHAIN_PATH"
          security import "$STUDIO_CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$STUDIO_KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$STUDIO_KEYCHAIN_PATH"
          security list-keychains -d user -s "$STUDIO_KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"
          STUDIO_SIGNING_IDENTITY="$(security find-identity -v -p codesigning "$STUDIO_KEYCHAIN_PATH" | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' | head -n 1)"
          test -n "$STUDIO_SIGNING_IDENTITY" || { echo "The imported certificate does not contain a Developer ID Application identity" >&2; exit 1; }
          echo "APPLE_SIGNING_IDENTITY=$STUDIO_SIGNING_IDENTITY" >> "$GITHUB_ENV"
      - name: Configure App Store Connect notarization key
        if: startsWith(matrix.platform, 'macos')
        env:
          APPLE_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
        run: |
          APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$APPLE_API_KEY_PATH"
          chmod 600 "$APPLE_API_KEY_PATH"
          echo "APPLE_API_KEY=$APPLE_API_KEY_ID" >> "$GITHUB_ENV"
          echo "APPLE_API_ISSUER=$APPLE_API_ISSUER" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_PATH=$APPLE_API_KEY_PATH" >> "$GITHUB_ENV"
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ env.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ env.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
          VITE_STUDIO_UPDATER_ENABLED: "true"
        with:
          tagName: studio-v__VERSION__
          releaseName: Amplifier Studio v__VERSION__
          releaseBody: Signed and notarized macOS installer and updater artifacts for Amplifier Studio.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: false
          args: >-
            ${{ matrix.args }}
            --config '{"bundle":{"createUpdaterArtifacts":true},"plugins":{"updater":{"endpoints":["https://github.com/${{ github.repository }}/releases/latest/download/latest.json"]}}}'
      - name: Verify macOS signature and notarization ticket
        if: startsWith(matrix.platform, 'macos')
        run: |
          APP_PATH="$(find src-tauri/target -type d -path '*/release/bundle/macos/Amplifier Studio.app' -print -quit)"
          test -n "$APP_PATH" || { echo "Amplifier Studio.app was not produced" >&2; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          # The Hardened Runtime denies the microphone unless the signature actually carries the
          # entitlement. Assert on the signed binary, not on tauri.conf.json: a config key that
          # silently fails to reach codesign is exactly the failure this is here to catch.
          codesign -d --entitlements :- --xml "$APP_PATH" > /tmp/studio-entitlements.plist 2>/dev/null
          plutil -p /tmp/studio-entitlements.plist
          # plutil splits key paths on '.', so the entitlement name has to be escaped or it is
          # read as a nested path and never found. The unescaped form failed against a build
          # that carried the entitlement correctly, i.e. it would have blocked a good release.
          test "$(plutil -extract 'com\.apple\.security\.device\.audio-input' raw /tmp/studio-entitlements.plist)" = "true" \
            || { echo "signed app is missing com.apple.security.device.audio-input; voice input would fail for every user" >&2; exit 1; }
          # The entitlement only does anything under the Hardened Runtime, so assert both.
          codesign -dv --verbose=2 "$APP_PATH" 2>&1 | grep -q "flags=.*runtime" \
            || { echo "signed app is not using the Hardened Runtime" >&2; exit 1; }

  publish-release:
    needs: publish-desktop
    runs-on: ubuntu-22.04
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG_NAME: ${{ github.ref_name }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Node 22 bundles npm 10.9.x, whose arborist crashes resolving vitest 4's peer graph
      # ("Cannot read properties of null (reading 'edgesOut')" in #loadPeerSet). npm 11 resolves
      # it. Without this every runner fails at install, before a single test runs.
      - name: Use npm 11
        run: npm install -g npm@11
      - name: Download the complete draft release
        run: gh release download "$TAG_NAME" --dir release-assets
      - name: Build one cross-platform updater manifest
        run: node scripts/merge-update-manifest.mjs "$TAG_NAME" release-assets
      - name: Publish exactly one complete desktop release
        run: |
          gh release upload "$TAG_NAME" release-assets/latest.json --clobber
          gh release edit "$TAG_NAME" --draft=false --latest
      - name: Verify the public updater feed
        run: |
          curl --fail --location --retry 5 --retry-delay 2 \
            "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/latest.json" \
            --output public-latest.json
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const manifest = JSON.parse(readFileSync("public-latest.json", "utf8"));
            const expected = JSON.parse(readFileSync("package.json", "utf8")).version;
            if (manifest.version !== expected) throw new Error(`public updater is ${manifest.version}; expected ${expected}`);
            for (const platform of ["darwin-aarch64"]) {
              if (!manifest.platforms?.[platform]?.url || !manifest.platforms?.[platform]?.signature) {
                throw new Error(`public updater is missing ${platform}`);
              }
            }
          '
