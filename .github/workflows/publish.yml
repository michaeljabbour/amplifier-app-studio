name: Publish Amplifier Studio

on:
  push:
    tags:
      - "studio-v*"

concurrency:
  group: amplifier-studio-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run release:check
      - run: npm test
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  release-preflight:
    needs: verify
    runs-on: ubuntu-22.04
    environment: release
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
      WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
    steps:
      - name: Require every desktop signing identity before creating a release
        run: |
          for name in TAURI_SIGNING_PRIVATE_KEY APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD KEYCHAIN_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID WINDOWS_CERTIFICATE WINDOWS_CERTIFICATE_PASSWORD WINDOWS_CERTIFICATE_THUMBPRINT WINDOWS_TIMESTAMP_URL; do
            test -n "${!name}" || { echo "$name is required for a desktop release" >&2; exit 1; }
          done

  publish-desktop:
    needs: [verify, release-preflight]
    permissions:
      contents: write
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15
            args: --target aarch64-apple-darwin
            target: aarch64-apple-darwin
          - platform: macos-15-intel
            args: --target x86_64-apple-darwin
            target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
            target: ""
          - platform: windows-latest
            args: ""
            target: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cross-compilation target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run release:check
      - name: Import Developer ID certificate
        if: startsWith(matrix.platform, 'macos')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          test -n "$APPLE_CERTIFICATE" || { echo "APPLE_CERTIFICATE is required for macOS releases" >&2; exit 1; }
          STUDIO_CERTIFICATE_PATH="$RUNNER_TEMP/amplifier-studio.p12"
          STUDIO_KEYCHAIN_PATH="$RUNNER_TEMP/amplifier-studio-signing.keychain-db"
          echo -n "$APPLE_CERTIFICATE" | base64 --decode > "$STUDIO_CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$STUDIO_KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$STUDIO_KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$STUDIO_KEYCHAIN_PATH"
          security import "$STUDIO_CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$STUDIO_KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$STUDIO_KEYCHAIN_PATH"
          security list-keychains -d user -s "$STUDIO_KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"
          STUDIO_SIGNING_IDENTITY="$(security find-identity -v -p codesigning "$STUDIO_KEYCHAIN_PATH" | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' | head -n 1)"
          test -n "$STUDIO_SIGNING_IDENTITY" || { echo "The imported certificate is not a valid Developer ID Application identity" >&2; exit 1; }
          echo "APPLE_SIGNING_IDENTITY=$STUDIO_SIGNING_IDENTITY" >> "$GITHUB_ENV"
      - name: Import Windows Authenticode certificate
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
        run: |
          if ($env:WINDOWS_CERTIFICATE_THUMBPRINT -notmatch '^[0-9A-Fa-f]{40}$') {
            throw "WINDOWS_CERTIFICATE_THUMBPRINT must be a 40-character SHA-1 thumbprint"
          }
          $expectedThumbprint = ($env:WINDOWS_CERTIFICATE_THUMBPRINT).ToUpperInvariant()
          $certificatePath = Join-Path $env:RUNNER_TEMP "amplifier-studio.pfx"
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $securePassword = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $importedCertificates = @(Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword)
          $certificate = $importedCertificates |
            Where-Object { ($_.Thumbprint -replace '\s', '').ToUpperInvariant() -eq $expectedThumbprint } |
            Select-Object -First 1
          if (-not $certificate) {
            throw "Imported Authenticode certificate thumbprint does not match WINDOWS_CERTIFICATE_THUMBPRINT"
          }
      - uses: tauri-apps/tauri-action@v1
        if: matrix.platform != 'windows-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          VITE_STUDIO_UPDATER_ENABLED: "true"
        with:
          tagName: studio-v__VERSION__
          releaseName: Amplifier Studio v__VERSION__
          releaseBody: See the assets below to install or update Amplifier Studio.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: false
          args: >-
            ${{ matrix.args }}
            --config '{"bundle":{"createUpdaterArtifacts":true},"plugins":{"updater":{"endpoints":["https://github.com/${{ github.repository }}/releases/latest/download/latest.json"]}}}'
      - uses: tauri-apps/tauri-action@v1
        if: matrix.platform == 'windows-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_STUDIO_UPDATER_ENABLED: "true"
        with:
          tagName: studio-v__VERSION__
          releaseName: Amplifier Studio v__VERSION__
          releaseBody: See the assets below to install or update Amplifier Studio.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: false
          args: >-
            --config '{"bundle":{"createUpdaterArtifacts":true,"windows":{"certificateThumbprint":"${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}","digestAlgorithm":"sha256","timestampUrl":"${{ secrets.WINDOWS_TIMESTAMP_URL }}"}},"plugins":{"updater":{"endpoints":["https://github.com/${{ github.repository }}/releases/latest/download/latest.json"]}}}'

  publish-release:
    needs: publish-desktop
    runs-on: ubuntu-22.04
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG_NAME: ${{ github.ref_name }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Download the complete draft release
        run: gh release download "$TAG_NAME" --dir release-assets
      - name: Build one cross-platform updater manifest
        run: node scripts/merge-update-manifest.mjs "$TAG_NAME" release-assets
      - name: Replace partial updater metadata and publish exactly one release
        run: |
          gh release upload "$TAG_NAME" release-assets/latest.json --clobber
          gh release edit "$TAG_NAME" --draft=false --latest
